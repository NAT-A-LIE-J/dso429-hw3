name: Watchdog

# A second, independent chain of runs, built like answer.yml: each run
# checks every 5 minutes for just under 6 hours, then starts its
# replacement. Each check opens an issue (which emails the repo owner) when
# a released round has no answer file 20 minutes after release, and starts
# an answer run if none is alive. The answer loop restarts this chain if it
# stops, so either chain can revive the other. GitHub's cron barely fires
# on this repo, so the schedule below is only a last-resort restart.
#
# Stops itself with answer.yml: after 3 PM Pacific Oct 22, once round 168
# is answered.

on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long this run keeps checking before handing off"
        default: "340"
      pretend_missing:
        description: "Test: treat this round's answer file as missing"
        default: ""

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every released round has an answer, every 5 minutes
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          MINUTES: ${{ inputs.minutes || '340' }}
          PRETEND: ${{ inputs.pretend_missing }}
        run: |
          stop=$(( $(date +%s) + MINUTES * 60 ))
          final=$(date -u -d 2026-10-22T22:00:00Z +%s)
          while :; do
            git pull --quiet || echo "::warning::git pull failed"
            python tools/watchdog.py ${PRETEND:+--pretend-missing "$PRETEND"} || echo "::warning::watchdog failed"
            if [ "$(date +%s)" -ge "$final" ] && [ -f answers/round-0168.json ]; then
              echo "finished=true" >> "$GITHUB_OUTPUT"
              break
            fi
            [ "$(date +%s)" -ge "$stop" ] && break
            sleep 300
          done

      # Skipped when a run is cancelled by hand, so cancelling stops the chain.
      - name: Start the next run
        if: ${{ !cancelled() && steps.check.outputs.finished != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run watchdog.yml --ref main --repo "$GITHUB_REPOSITORY"

      - name: Disable this workflow (homework is over)
        if: ${{ steps.check.outputs.finished == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow disable watchdog.yml --repo "$GITHUB_REPOSITORY"
